name: iOS

on:
  # Branch pushes are covered by the pull_request trigger; running push
  # as well meant every commit was tested twice (and a flake in either
  # run painted the PR red). Push stays for main only.
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -project Crossdeck.xcodeproj -scheme Crossdeck \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim build

      - name: UI test on iPad simulator (launch, app chrome, web view, screenshot)
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 'iPad' | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Using simulator $UDID"
          xcodebuild test -project Crossdeck.xcodeproj -scheme Crossdeck \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult

      - name: Extract UI test screenshot
        if: always()
        working-directory: ios
        run: |
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path ui-attachments || true
          find ui-attachments -type f 2>/dev/null | head -20 || true

      - name: Upload UI test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-screenshot
          path: ios/ui-attachments
          if-no-files-found: ignore
          retention-days: 7

      - name: Build for device and package unsigned .ipa
        working-directory: ios
        run: |
          xcodebuild -project Crossdeck.xcodeproj -scheme Crossdeck \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-device build
          APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          rm -rf Payload crossdeck.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r crossdeck.ipa Payload

      - name: Upload .ipa (unsigned, for AltStore sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: crossdeck-ios-ipa
          path: ios/crossdeck.ipa
          retention-days: 7

  # Publishes the built .ipa as a GitHub Release and regenerates the
  # AltStore/SideStore source (apps.json at the repo root) so the app can
  # be installed and updated from AltStore Classic or SideStore:
  #   https://raw.githubusercontent.com/tsuzu/crossdeck/main/apps.json
  # Runs only on main (merges and manual dispatches), never on PRs.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Download .ipa artifact
        uses: actions/download-artifact@v4
        with:
          name: crossdeck-ios-ipa
          path: dist

      - name: Publish release and update apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' ios/project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="ios-v$VERSION"
          echo "Publishing $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "crossdeck iOS $VERSION" \
              --notes "Unsigned .ipa of the crossdeck iPad app. Install via the AltStore/SideStore source: https://raw.githubusercontent.com/tsuzu/crossdeck/main/apps.json"
          fi
          gh release upload "$TAG" dist/crossdeck.ipa --clobber
          SIZE=$(stat -c%s dist/crossdeck.ipa)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 - "$VERSION" "$SIZE" "$DATE" <<'PYEOF'
          import json, os, sys
          version, size, date = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          # Keep the existing file (and its versionDate) when neither the
          # version nor the binary changed, to avoid a churn commit on
          # every main run.
          if os.path.exists("apps.json"):
              try:
                  current = json.load(open("apps.json"))["apps"][0]
                  if current.get("version") == version and current.get("size") == size:
                      print("apps.json already current; leaving as is")
                      sys.exit(0)
              except Exception:
                  pass
          source = {
              "name": "crossdeck (tsuzu)",
              "identifier": "dev.tsuzu.crossdeck",
              "subtitle": "tsuzu's apps",
              "description": "Source for tsuzu's sideloaded apps. Add this URL in AltStore Classic or SideStore to install and update crossdeck for iPad.",
              "apps": [{
                  "name": "crossdeck",
                  "bundleIdentifier": "com.crossdeck.app",
                  "developerName": "tsuzu",
                  "subtitle": "Multi-profile X browser for iPad",
                  "localizedDescription": "Native iPad port of the crossdeck desktop app: multiple X profiles (isolated logins) as side-by-side columns, tab persistence, auto-reload, promoted-post hiding and hardware-keyboard shortcuts.",
                  "iconURL": "https://raw.githubusercontent.com/tsuzu/crossdeck/main/ios/Crossdeck/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                  "tintColor": "#1d9bf0",
                  "version": version,
                  "versionDate": date,
                  "versionDescription": f"See GitHub release ios-v{version}.",
                  "downloadURL": f"https://github.com/tsuzu/crossdeck/releases/download/ios-v{version}/crossdeck.ipa",
                  "size": size,
              }],
              "news": [],
          }
          with open("apps.json", "w") as f:
              json.dump(source, f, indent=2, sort_keys=True)
              f.write("\n")
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "apps.json unchanged"
          else
            git commit -m "chore(ios): update AltStore source to $VERSION"
            git push origin HEAD:main
          fi
